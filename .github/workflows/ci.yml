name: SDK CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/node26
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          # Keep in sync with maven.compiler.release in pom.xml.
          java-version: '21'
      # Compiles, tests and builds the main, sources and javadoc jars.
      - run: mvn -B verify
